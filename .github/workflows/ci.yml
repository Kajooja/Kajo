name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Bundle smoke test (iOS + Android)
        run: npm run smoke

  database-platform:
    name: Supabase platform and forward defaults
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify isolated Supabase platform and rollback
        run: node scripts/database/run-ci-platform-probe.mjs "$RUNNER_TEMP/kajo-platform-report.json"

      - name: Upload platform metadata report
        uses: actions/upload-artifact@v4
        with:
          name: kajo-platform-${{ github.sha }}
          path: ${{ runner.temp }}/kajo-platform-report.json
          if-no-files-found: error
          retention-days: 7

  database-installation:
    name: Two clean Supabase application installations
    needs: database-platform
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify two isolated application installations
        run: node scripts/database/run-ci-installation-probe.mjs "$RUNNER_TEMP/kajo-installation-report.json"

      - name: Upload application installation report
        uses: actions/upload-artifact@v4
        with:
          name: kajo-installation-${{ github.sha }}
          path: ${{ runner.temp }}/kajo-installation-report.json
          if-no-files-found: error
          retention-days: 7

  android-apk:
    name: Build standalone Android APK
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [validate, database-platform, database-installation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build standalone release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify embedded JavaScript bundle
        run: |
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q "assets/index.android.bundle"

      - name: Upload standalone Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kajo-android-standalone-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
