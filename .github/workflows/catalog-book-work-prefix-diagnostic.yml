name: Pinned BOOK Work-prefix diagnostic

# One distinct prefix request. No replay of the consumed full-dump request.
on:
  push:
    branches: [catalog-diagnostic/ol-20260831-work-prefix]
    paths: [scripts/catalog/requests/ol-20260831-work-prefix.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: kajo-book-work-prefix-diagnostic-20260831
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.repository == 'Kajooja/Kajo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out accepted main only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install frozen catalog dependencies without lifecycle scripts
        run: npm ci --workspace @kajo/catalog-contracts --include-workspace-root=false --ignore-scripts --no-audit --no-fund
      - name: Validate distinct request, diagnose bounded Work prefix and encrypt
        id: diagnose
        env:
          WORK_PREFIX_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/catalog/run-work-prefix-diagnostic.mjs "$RUNNER_TEMP/kajo-book-work-prefix-sealed"
      - name: Upload authenticated ciphertext only
        if: always() && steps.diagnose.outputs.sealed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kajo-book-work-prefix-sealed-${{ github.run_id }}
          path: ${{ runner.temp }}/kajo-book-work-prefix-sealed/open-library-work-prefix-20260831.sealed.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
